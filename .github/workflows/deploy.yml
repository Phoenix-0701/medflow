name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main
      - master
      - bkmed30_07

env:
  AWS_REGION: ap-southeast-2                   # Vùng AWS của bạn
  ECR_REPOSITORY_CLIENT: medflow-client        # Tên kho ECR cho client
  ECR_REPOSITORY_SERVER: medflow-server        # Tên kho ECR cho server
  ECR_REPOSITORY_AI: medflow-ai                # Tên kho ECR cho AI
  ECS_SERVICE: medflow-service                 # Tên dịch vụ ECS
  ECS_CLUSTER: medflow-cluster                 # Tên Cluster ECS
  ECS_TASK_DEFINITION: aws/task-definition.json # File cấu hình Task Definition

jobs:
  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push Client image to Amazon ECR
      id: build-client
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd medflow-client
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_CLIENT:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_CLIENT:$IMAGE_TAG
        echo "image_client=$ECR_REGISTRY/$ECR_REPOSITORY_CLIENT:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push Server image to Amazon ECR
      id: build-server
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd medflow-server
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_SERVER:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_SERVER:$IMAGE_TAG
        echo "image_server=$ECR_REGISTRY/$ECR_REPOSITORY_SERVER:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Build, tag, and push AI image to Amazon ECR
      id: build-ai
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        cd medflow-ai
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_AI:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY_AI:$IMAGE_TAG
        echo "image_ai=$ECR_REGISTRY/$ECR_REPOSITORY_AI:$IMAGE_TAG" >> $GITHUB_OUTPUT

    - name: Fill in the new Client image ID in the Amazon ECS task definition
      id: task-def-client
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.ECS_TASK_DEFINITION }}
        container-name: medflow-client
        image: ${{ steps.build-client.outputs.image_client }}

    - name: Fill in the new Server image ID in the Amazon ECS task definition
      id: task-def-server
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-client.outputs.task-definition }}
        container-name: medflow-server
        image: ${{ steps.build-server.outputs.image_server }}

    - name: Fill in the new AI image ID in the Amazon ECS task definition
      id: task-def-ai
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-server.outputs.task-definition }}
        container-name: medflow-ai
        image: ${{ steps.build-ai.outputs.image_ai }}

    - name: Deploy Amazon ECS task definition
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def-ai.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true
